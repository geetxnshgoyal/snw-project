<!DOCTYPE html>
<html>

<head>
    <title>Zoura - Home</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <div class="header">
        <div class="logo">Zoura</div>
        <div class="nav">
            <a href="index.html">Home</a>
            <a href="questions.html">Questions</a>
            <a href="ask.html">Ask Question</a>
            <a href="profile.html">Profile</a>
        </div>
    </div>

    <div class="container">
        <div class="welcome">
            <h1>Welcome to Zoura</h1>
            <p>A place to share knowledge and better understand the world</p>
            <p id="currentTime"></p>
        </div>

        <div class="search-sort-box">
            <input type="text" id="searchInput" placeholder="Search questions..." onkeyup="searchQuestions()">
            <div class="sort-buttons">
                <button onclick="sortQuestions('newest')" class="sort-btn">Newest</button>
                <button onclick="sortQuestions('answers')" class="sort-btn">Most Answers</button>
                <button onclick="sortQuestions('likes')" class="sort-btn">Most Likes</button>
            </div>
        </div>

        <div id="questionsContainer"></div>
    </div>

    <div class="footer">
        <p>Zoura 2026 - Share Knowledge</p>
    </div>
</body>

</html>
